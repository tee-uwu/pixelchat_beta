<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pixel Chat</title>

  <script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #1e293b, #020617 65%);
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      line-height: 1.3;
      overflow: hidden;
    }
    
    .font-bold {
      font-family: 'Orbitron', monospace !important;
      font-weight: 900 !important;
    }

    .glass {
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 0 30px rgba(0,0,0,0.45);
    }

    .neon { text-shadow: 0 0 8px #8b5cf6, 0 0 20px #6366f1; }

    .input {
      background: rgba(255,255,255,0.06) !important;
      color: white !important;
      border-color: rgba(255,255,255,0.12) !important;
    }

    .input:focus {
      outline: none !important;
      border-color: #6366f1 !important;
      box-shadow: 0 0 12px rgba(99,102,241,0.55);
    }

    .btn-primary {
      background: linear-gradient(90deg, #6366f1, #8b5cf6) !important;
      border: none !important;
      color: white !important;
      box-shadow: 0 0 12px rgba(99,102,241,0.55);
    }

    .btn-ghost-lite {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
    }

    .chat-bubble { word-break: break-word; box-shadow: 0 0 10px rgba(0,0,0,0.35); }
    .chat-bubble-primary { box-shadow: 0 0 12px rgba(99,102,241,0.45); }
    
    .chat-bubble-pink { 
      background-color: #ff52d9 !important; 
      color: #111827 !important; 
      box-shadow: 0 0 15px rgba(255, 82, 217, 0.40); 
    }

    .user-card {
      transition: all 0.18s ease;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .user-card.active {
      background: rgba(99,102,241,0.18);
      border-color: rgba(139,92,246,0.45);
      box-shadow: 0 0 18px rgba(99,102,241,0.30);
    }

    .message-options { opacity: 0; transition: opacity 0.2s; }
    .chat:hover .message-options { opacity: 1; }

    .mobile-safe-height { height: 100dvh; }
    .messages-area::-webkit-scrollbar { width: 8px; }
    .messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 999px; }
  </style>
</head>

<body class="text-white">
  <div class="mobile-safe-height flex flex-col">
    <div class="navbar glass px-3 md:px-4 shrink-0 rounded-none md:rounded-b-2xl">
      <div class="flex items-center gap-2 flex-1 min-w-0">
        <button class="btn btn-sm btn-ghost-lite md:hidden" onclick="toggleSidebar(true)">☰</button>
        <h1 class="text-lg md:text-xl font-bold neon truncate">🎮 Pixel Chat</h1>
      </div>
      <div class="flex items-center gap-2 md:gap-3">
        <span id="loggedUser" class="text-xs md:text-sm opacity-90 truncate max-w-[110px]"></span>
        <button class="btn btn-error btn-xs md:btn-sm" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="flex-1 min-h-0 p-2 md:p-4">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 h-full">
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden" onclick="toggleSidebar(false)"></div>
        <aside id="sidebar" class="fixed md:static top-0 left-0 z-40 h-full w-[84%] max-w-[320px] md:w-auto md:translate-x-0 translate-x-[-100%] transition-transform duration-200 glass rounded-none md:rounded-2xl p-3 md:p-4 flex flex-col">
          <input id="userSearch" class="input input-bordered w-full mb-3" placeholder="Search users..." oninput="filterUsers()" />
          <div id="userList" class="space-y-2 overflow-y-auto flex-1"></div>
        </aside>

        <section class="md:col-span-3 glass rounded-2xl flex flex-col min-h-0 overflow-hidden">
          <div class="border-b border-white/10 px-3 md:px-5 py-3">
            <h2 id="chatTitle" class="font-bold text-base md:text-xl neon truncate">Select a user</h2>
          </div>

          <div id="messages" class="messages-area flex-1 min-h-0 overflow-y-auto px-3 md:px-5 py-4 space-y-4 bg-black/20"></div>

          <div id="typing" class="px-3 md:px-5 py-1 min-h-[20px] text-xs text-gray-400 italic"></div>

          <div class="border-t border-white/10 p-3 md:p-4 relative">
            <div id="emojiBox" class="hidden absolute bottom-20 left-4 glass p-3 rounded-2xl grid grid-cols-6 gap-2 z-50">
               <button onclick="addEmoji('😀')" class="hover:scale-125 transition">😀</button>
               <button onclick="addEmoji('😂')" class="hover:scale-125 transition">😂</button>
               <button onclick="addEmoji('😍')" class="hover:scale-125 transition">😍</button>
               <button onclick="addEmoji('🔥')" class="hover:scale-125 transition">🔥</button>
               <button onclick="addEmoji('👍')" class="hover:scale-125 transition">👍</button>
               <button onclick="addEmoji('❤️')" class="hover:scale-125 transition">❤️</button>
            </div>

            <div class="flex items-end gap-2">
              <button class="btn btn-square btn-ghost-lite shrink-0" onclick="toggleEmoji()">😀</button>
              <label for="fileInput" class="btn btn-square btn-ghost-lite shrink-0">
                📎
                <input id="fileInput" type="file" class="hidden" accept="image/*,.pdf" onchange="handleFile()">
              </label>
              <div class="flex-1 relative">
                <input id="messageInput" class="input input-bordered w-full pr-12" placeholder="Type message or attach file..." autocomplete="off" />
                <div id="attachmentPreview" class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center gap-1 text-xs bg-blue-500 text-white px-2 py-1 rounded opacity-0 transition-all hidden group">
                  <span id="previewText"></span>
                  <button onclick="cancelAttachment()" class="text-xs hover:text-red-300 ml-1" title="Cancel">✕</button>
                </div>
              </div>
              <button id="sendBtn" class="btn btn-primary shrink-0 px-4 md:px-5" onclick="sendMessage()">Send</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script>
const API = "https://pixelchat-beta.onrender.com/api";
const SOCKET_URL = "https://pixelchat-beta.onrender.com";
    const token = localStorage.getItem("token");
    const currentUser = JSON.parse(localStorage.getItem("user"));
    
    let selectedUser = null;
    let socket = null;
    let editingMessageId = null;

    if (!token || !currentUser) window.location.href = "index.html";
    document.getElementById("loggedUser").innerText = `${currentUser.username} (${currentUser.role})`;

    function connectSocket() {
      socket = io(SOCKET_URL, { auth: { token } });
      
      socket.on("receive_message", (msg) => {
        if (selectedUser && (msg.sender_id === selectedUser.id || msg.sender_id === currentUser.id)) {
            appendMessage(msg);
            
            // Mark as seen if not own message
            if (msg.sender_id !== currentUser.id && !msg.seen) {
              fetch(`${API}/messages/seen/${msg.id}`, { 
                method: 'PUT',
                headers: { Authorization: `Bearer ${token}` }
              }).catch(console.error);
            }
        }
      });

      //  Online Users Bulk Update
      socket.on("online_users", (users) => {
        users.forEach(userId => {
          const el = document.getElementById(`status-${userId}`);
          if (el) {
            el.innerText = "online";
            el.className = "text-[10px] px-2 py-[2px] rounded-full bg-green-500";
          }
        });
      });

      // 🔽 Online Status Individual Update
      socket.on("user_status", ({ userId, status }) => {
        const el = document.getElementById(`status-${userId}`);
        if (el) {
          el.innerText = status;
          el.className = `text-[10px] px-2 py-[2px] rounded-full ${
            status === "online" ? "bg-green-500" : "bg-gray-500"
          }`;
        }
      });

      socket.on("user_last_active", ({ userId, last_active }) => {
        const el = document.getElementById(`last-active-${userId}`);
        if (el) {
          const timeAgo = new Date(last_active).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          el.textContent = `Last active: ${timeAgo}`;
        }
      });

      // 🔽 Typing Indicators
      socket.on("typing", ({ sender_id }) => {
        if (selectedUser && sender_id === selectedUser.id) {
          document.getElementById("typing").innerText = "typing...";
        }
      });

      socket.on("stop_typing", ({ sender_id }) => {
        if (selectedUser && sender_id === selectedUser.id) {
          document.getElementById("typing").innerText = "";
        }
      });

      // 🔽 Message Edited 
      socket.on("message_edited", (data) => {
          const id = data.id;
          const text = data.message;
          
          const container = document.getElementById(`msg-${id}`);
          if (container) {
            const bubble = container.querySelector(".chat-bubble");
            if (bubble) {
              const existingEdited = bubble.querySelector('.edited-badge');
              if (existingEdited) existingEdited.remove();
              bubble.innerHTML = text.replace(/<span class="edited-badge[^>]*>.*?<\/span>$/i, '') + ' <span class="edited-badge text-[10px] opacity-60 italic ml-1">(edited)</span>';
            }
          }
      });

      // Delete Message Update
      socket.on("message_deleted", (data) => {
          document.getElementById(`msg-${data.id}`)?.remove();
      });
    }

    async function loadUsers() {
      const res = await fetch(`${API}/auth/users`, { headers: { Authorization: `Bearer ${token}` } });
      const users = await res.json();
      const list = document.getElementById("userList");
      list.innerHTML = "";
      users.forEach(user => {
        const btn = document.createElement("button");
        btn.className = `user-card w-full p-3 text-left rounded-xl transition flex justify-between items-center ${selectedUser?.id === user.id ? 'active' : ''}`;
        btn.onclick = () => selectUser(user);
        btn.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="font-bold truncate">${user.username}</div>
            <div class="text-xs opacity-50">${user.role}</div>
            <div id="last-active-${user.id}" class="text-xs opacity-60 mt-1">Last active: --</div>
          </div>
          <span id="status-${user.id}" class="text-[10px] px-2 py-[2px] rounded-full bg-gray-500 ml-auto">offline</span>
        `;
        list.appendChild(btn);
      });
    }

    async function selectUser(user) {
      selectedUser = user;
      document.getElementById("chatTitle").innerText = `Chat with ${user.username}`;
      loadUsers();
      const res = await fetch(`${API}/messages/${user.id}`, { headers: { Authorization: `Bearer ${token}` } });
      const messages = await res.json();
      
      // Mark all messages as seen
      messages.forEach(msg => {
        if (msg.sender_id !== currentUser.id && !msg.seen) {
          fetch(`${API}/messages/seen/${msg.id}`, { 
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}` }
          }).catch(console.error);
        }
      });
      
      const container = document.getElementById("messages");
      container.innerHTML = "";
      messages.forEach(msg => appendMessage(msg));
      container.scrollTop = container.scrollHeight;
      if (window.innerWidth < 768) toggleSidebar(false);
    }

    function appendMessage(msg) {
      if (document.getElementById(`msg-${msg.id}`)) return;
      const isOwn = Number(msg.sender_id) === Number(currentUser.id);
      const isAdmin = currentUser.role.toLowerCase() === 'admin';
      
      const div = document.createElement("div");
      div.id = `msg-${msg.id}`;
      div.className = `chat ${isOwn ? 'chat-end' : 'chat-start'}`;

      const canDelete = isOwn || isAdmin;
      const canEdit = isOwn;

      let menuHtml = '';
      if (canDelete || canEdit) {
          menuHtml = `
            <div class="dropdown dropdown-top ${isOwn ? 'dropdown-left' : 'dropdown-right'} message-options mx-1">
                <label tabindex="0" class="cursor-pointer text-gray-400 hover:text-white px-1">⋮</label>
                <ul tabindex="0" class="dropdown-content z-[1] menu p-2 shadow glass bg-slate-900 rounded-box w-24 text-xs border border-white/10">
                    ${canEdit ? `<li><a onclick="prepareEdit(${msg.id}, ${JSON.stringify(msg.message || '')})">Edit</a></li>` : ''}
                    <li><a class="text-error" onclick="deleteMessage(${msg.id})">Delete</a></li>
                </ul>
            </div>`;
      }

      div.innerHTML = `
              <div class="chat-header opacity-50 text-[10px] mb-1 px-1 flex items-center gap-1">
                ${msg.sender_name || (isOwn ? currentUser.username : selectedUser?.username)}
                ${!isOwn && msg.seen ? '<span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>' : ''}
              </div>
        <div class="flex items-center">
            ${isOwn ? menuHtml : ''}
            <div class="chat-bubble ${isOwn ? 'chat-bubble-primary' : 'chat-bubble-pink'}">
              ${msg.message ? `<div>${msg.message}</div>` : ''}
              ${msg.attachment_url ? `
                <div class="mt-2">
                  ${msg.attachment_type === 'image' ? 
                    `<img src="${SOCKET_URL}${msg.attachment_url}" 
                          class="max-w-[200px] max-h-[200px] rounded-lg shadow-lg object-cover cursor-pointer hover:scale-105 transition-transform" 
                          alt="Attachment" 
                          onclick="showImagePreview('${SOCKET_URL}${msg.attachment_url}')">` : 
                    `<a href="${SOCKET_URL}${msg.attachment_url}" target="_blank" class="flex items-center gap-2 p-2 bg-black/20 rounded text-blue-300 underline text-xs">
                       📎 View ${String(msg.attachment_type || 'file').toUpperCase()}
                     </a>`
                  }
                </div>
              ` : ''}
            </div>
            ${!isOwn ? menuHtml : ''}
        </div>`;
      
      document.getElementById("messages").appendChild(div);
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
    }

    let currentAttachment = null;

    function handleFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) { // 10MB
        alert("File too large (max 10MB)");
        return;
      }

      const preview = document.getElementById("attachmentPreview");
      const previewText = document.getElementById("previewText");
      previewText.textContent = file.name;
      preview.classList.remove("hidden", "opacity-0");
      currentAttachment = file;
    }

    function cancelAttachment() {
      document.getElementById("fileInput").value = "";
      document.getElementById("attachmentPreview").classList.add("hidden");
      document.getElementById("previewText").textContent = "";
      currentAttachment = null;
    }

    function showImagePreview(url) {
      const modal = document.createElement('div');
      modal.id = 'imageModal';
      modal.className = 'fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="flex flex-col items-center max-w-4xl max-h-[90vh]">
          <img src="${url}" class="max-w-full max-h-[70vh] rounded-2xl shadow-2xl cursor-zoom-out hover:scale-105 transition">
          <button onclick="closeImagePreview()" class="mt-4 btn btn-error btn-sm px-6">Close</button>
        </div>
      `;
      document.body.appendChild(modal);
      modal.onclick = (e) => e.target === modal && closeImagePreview();
    }

    function closeImagePreview() {
      const modal = document.getElementById('imageModal');
      if (modal) modal.remove();
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const val = input.value.trim();
      const fileInput = document.getElementById("fileInput");
      const sendBtn = document.getElementById("sendBtn");

      // Prevent double-send while upload is in progress
      if (!selectedUser || sendBtn.disabled) return;

      // Don't send completely empty messages
      if (!val && !currentAttachment && !editingMessageId) return;

      if (editingMessageId) {
        // Fallback socket edit (backend socket handler)
        socket.emit("edit_message", { id: editingMessageId, new_message: val });
        
        editingMessageId = null;
        sendBtn.innerText = "Send";
        input.value = '';
        return;
      } 

      // Set loading state - simulate delay for visibility
      sendBtn.innerText = "Uploading...";
      sendBtn.disabled = true;
      sendBtn.classList.add("loading");

      if (currentAttachment) {
        const formData = new FormData();
        formData.append("receiver_id", selectedUser.id);
        formData.append("message", val || "📎 " + currentAttachment.name);
        formData.append("file", currentAttachment);
        
        fetch(`${API}/messages/upload`, {
          method: "POST",
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        })
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          return res.json();
        })
        .then(data => {
          // Success: show message, delay clear preview to show "working"
          appendMessage(data);
          setTimeout(() => {
            input.value = "";
            fileInput.value = "";
            document.getElementById("attachmentPreview").classList.add("hidden");
            currentAttachment = null;
            document.getElementById("emojiBox").classList.add("hidden");
          }, 1500); // 1.5s delay so user sees it "process"
          // Reset button
          sendBtn.innerText = "Send";
          sendBtn.disabled = false;
          sendBtn.classList.remove("loading");
        })
        .catch(err => {
          console.error("Upload failed:", err);
          alert(`Upload failed: ${err.message}. Please try again.`);
          // Reset button only, keep attachment
          sendBtn.innerText = "Send";
          sendBtn.disabled = false;
          sendBtn.classList.remove("loading");
        });
      } else {
        socket.emit("private_message", { 
          receiver_id: selectedUser.id, 
          message: val 
        });
        // Clear text input for non-attachment messages
        input.value = "";
        document.getElementById("emojiBox").classList.add("hidden");
        // Reset button
        sendBtn.innerText = "Send";
        sendBtn.disabled = false;
        sendBtn.classList.remove("loading");
      }
    }

    function prepareEdit(id, text) {
        editingMessageId = id;
        const input = document.getElementById("messageInput");
        input.value = decodeURIComponent(text);
        input.focus();
        document.getElementById("sendBtn").innerText = "Update";
    }

    function deleteMessage(id) {
        if (confirm("Delete this message?")) {
            socket.emit("delete_message", { id });
        }
    }

    function toggleEmoji() { document.getElementById("emojiBox").classList.toggle("hidden"); }
    function addEmoji(e) { 
        document.getElementById("messageInput").value += e; 
        document.getElementById("messageInput").focus();
    }
    function toggleSidebar(s) {
        document.getElementById("sidebar").style.transform = s ? "translateX(0)" : "translateX(-100%)";
        document.getElementById("sidebarOverlay").classList.toggle("hidden", !s);
    }
    function logout() { localStorage.clear(); window.location.href = "index.html"; }
    function filterUsers() {
      const term = document.getElementById("userSearch").value.toLowerCase();
      document.querySelectorAll(".user-card").forEach(card => card.style.display = card.innerText.toLowerCase().includes(term) ? "" : "none");
    }

    let typingTimeout;
    document.getElementById("messageInput").addEventListener("input", () => {
      if (!selectedUser) return;
      // Update status to online for everyone when typing
      socket.emit("user_status", { status: "online" });
      socket.emit("typing", { receiver_id: selectedUser.id });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit("stop_typing", { receiver_id: selectedUser.id });
      }, 1000);
    });

    document.getElementById("messageInput").onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };

    // Ping activity every 30s when user selected
    setInterval(() => {
      if (selectedUser) {
        socket.emit("user_active", { receiver_id: selectedUser.id });
      }
    }, 30000);

    connectSocket();
    loadUsers();
  </script>
</body>
</html>
